# Deploy daily-cron Worker to Cloudflare
# 触发：push 到 master 分支时自动部署
# 需要 GitHub Secrets：
#   - CLOUDFLARE_API_TOKEN  (有 Workers Scripts:Edit + Triggers:Edit 权限)
#   - BARK_KEY              (Bark push key)

name: Deploy Worker

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Upload BARK_KEY as secret
        run: echo "${{ secrets.BARK_KEY }}" | npx --yes wrangler@4 secret put BARK_KEY
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy Worker
        run: npx --yes wrangler@4 deploy --no-bundle
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
