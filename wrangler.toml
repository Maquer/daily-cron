# daily-cron Worker 配置
# Wrangler 4.x schema

name = "daily-cron"
main = "daily-cron.js"
compatibility_date = "2026-09-21"

# Cron Trigger（每 6 小时 UTC）
crontab = ["0 */6 * * *"]

# KV 存储
kv_namespaces = [
  { binding = "TASKS", id = "3739028244434433996ddaff2776fa51" }
]

# BARK_KEY 通过 wrangler secret 上传（不硬编码在仓库）
